<header class="site-header">
  <a class="site-header__logo" routerLink="/">Best4U</a>

  @if (showSearch()) {
  <app-search-bar />
  }

  <nav class="site-header__actions" aria-label="Account">
    <app-cart-badge />
    @if (authService.isAuthenticated()) {
    <app-notification-bell />
    <app-account-menu />
    } @else {
    <button class="site-header__signin" type="button" (click)="openSignIn()">
      Sign in
    </button>
    }
  </nav>
</header>
