<h1 style="margin-bottom: 16px">Your cart</h1>

@if (cartService.items().length === 0) {
<app-empty-state
  icon="🛒"
  title="Your cart is empty"
  message="Looks like you haven't added anything yet. Browse our catalog to get started."
  actionLabel="Browse products"
  actionRoute="/shop"
/>
} @else { @for (item of cartService.items(); track item.id) {
<div class="cart-item">
  <img
    class="cart-item__image"
    [src]="imageFor(item)"
    [alt]="item.productName"
  />
  <span class="cart-item__name">{{ item.productName }}</span>
  <span class="cart-item__price"
    >₹{{ item.unitPrice | number: '1.0-0' }} each</span
  >
  <input
    type="number"
    class="cart-item__qty"
    min="1"
    [value]="item.quantity"
    (change)="updateQuantity(item.productId, $any($event.target).value)"
  />
  <span class="cart-item__total">₹{{ item.lineTotal | number: '1.0-0' }}</span>
  <button
    class="shop-button shop-button--ghost"
    type="button"
    (click)="removeItem(item.id)"
  >
    ✕
  </button>
</div>
}

<div class="shop-summary">
  <div class="shop-summary__row shop-summary__row--total">
    <span>Total</span>
    <span>₹{{ cartService.total() | number: '1.0-0' }}</span>
  </div>
</div>

<button
  class="shop-button"
  type="button"
  style="margin-top: 16px"
  (click)="goToCheckout()"
>
  Proceed to checkout
</button>
}
