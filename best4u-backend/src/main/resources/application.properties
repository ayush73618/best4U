spring.application.name=best4u-backend
server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://localhost:5432/best4u
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

best4u.jwt.secret=PTyfanSC4ZNpbWHuWNXgFDTlbzon5lJn
best4u.jwt.expiration-ms=86400000

# Spring's default max upload size is 1MB - anything bigger fails silently
# without this. Adjust these if you need larger PDFs/images.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB
